<hmtl>
  <head>
    <title>class 2</title>
  </head>
  <body>
    this text is untagged
    <!-- these are block -->
    <h1>header</h1>
    <p>this is a normal paragraph</p>
    <p>this has <em>italics </em></p>
    <!-- these are in line level -->
    <strong> this is bolded but no p tag</strong>
    <em>this is an entire sentence</em>
    <!-- dividing element: used to denote a group of things -->
    <div>
      <p>these are seperated into a divider</p>
      <p>PARAGRAPHS</p>
    </div>
    <!-- adds a line to a page  -->
    <hr />
    <!-- generic inline element, order matters, used for styling-->
    <span> hi </span>
    <span> hello </span>
    <span> greetings</span>
    <p>what is this <span> hello</span></p>
    <img src="taco bell.webp" />
    <img
      src="https://images.stockcake.com/public/a/a/6/aa60dc88-fc87-469a-b6a0-486a66093e92_medium/jolly-santa-magic-stockcake.jpg"
    />
    <p>
      <a href="page2.html"> go to <em>page 2</em></a>
    </p>
    <br />
    <br />
    <br />
    <br />
    <a href="page2.html"
    <img src="https://www.akc.org/wp-content/uploads/2017/11/Chihuahua-standing-in-three-quarter-view.jpg" />
    
    
  </body>
</hmtl>
