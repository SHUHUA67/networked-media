<html>
  <!-- Q: What type of content goes inside the <head>? 
    Does it show up on the webpage? -->
  <!-- A: text that show up in the title include the header, subheader, and other text that you'd like to be adjusted but doesnt show 
 on the webpage its just the style sheet -->

  <head>
    <title>class 5 demo 😌</title>
    <link href=" style.css" rel="stylesheet" />
    <script src="main.js"></script>
  </head>

  <!-- Q: What type of content goes inside the <body>? 
    Does it show up on the webpage? -->
  <!-- A: the content in the body shows all the things that you can literally see on a website -->
  and is basically the overall skeleton of the page.

  <body>
    <p>this is a paragraph</p>
    <p class="blue">this is a second paragraph</p>
    <p id="main">this is a third paragraph</p>
    <div class="blue"></div>

    <!-- now open up style.css -->
  </body>
</html>

<!-- use class and id, if using style for a lot of things you can use class -->
